[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tollbooth-wasmcp"
dynamic = ["version"]
description = "Spin/WASI host adapter for tollbooth-dpyc Operators — deploy a DPYC operator to Fermyon Spin / Akamai Functions with just business logic."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "lonniev" }]
keywords = ["mcp", "wasm", "wasi", "spin", "wasmcp", "tollbooth", "dpyc"]
dependencies = [
    # The transport + bootstrap ride httpx (routed over wasi:http at build time).
    "httpx>=0.28",
]

[project.urls]
Homepage = "https://github.com/lonniev/tollbooth-wasmcp"

# The tollbooth-dpyc wheel is a peer the operator installs itself (with --no-deps,
# to keep the wheel's native crypto libs out of the Wasm bundle — the composed
# dpyc:crypto component supplies them). It is intentionally NOT a hard dependency.

[tool.hatch.version]
path = "tollbooth_wasmcp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["tollbooth_wasmcp"]
# crypto.wasm is a built artifact (gitignored); force-include it in the wheel.
artifacts = ["tollbooth_wasmcp/crypto.wasm"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# This repo selects no rule set, so it inherits ruff's DEFAULTS — and those move.
# ruff 0.16 enabled BLE001/S110 by default and turned 43 pre-existing lines red
# without a single code change, in CI that runs an unpinned `pipx run ruff`.
#
# BLE001 (`except Exception`) and S110 (`try`/`except`/`pass`) are the host
# adapter's JOB, not an oversight. Every one sits on an OPTIONAL seam: a
# `wit_world` import that only exists under one host, a `wasi:config` key the
# operator may not have set, a package walked purely to force it into the bundle.
# A Spin operator must degrade past an absent seam, not abort — the guest cannot
# be crashed by a probe for something documented as optional.
#
# Declared here, once, with the reason — rather than as 21 scattered `noqa`s that
# say nothing. NOT a blanket amnesty: narrowing each seam to the exception it
# actually expects (ImportError at the import, ValueError/KeyError over registry
# data) is a real improvement, but it changes runtime behaviour in a component
# that cannot be executed off a Wasm host, so it wants its own change and its own
# test — not a lint sweep.
ignore = ["BLE001", "S110"]

[tool.ruff.lint.per-file-ignores]
# Vendored componentize-py async support + top-level shims — imported for their
# side effects / bundled name surface; not linted as first-party code.
"tollbooth_wasmcp/poll_loop.py" = ["F401", "E402", "E501", "E741", "E722"]
"tollbooth_wasmcp/transport.py" = ["E501"]
"tollbooth_wasmcp/_toplevel/**" = ["F401", "E402", "E501"]
