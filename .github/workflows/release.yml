name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Rebuild the dpyc:crypto component so the wheel ships a fresh crypto.wasm.
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-wasip1
          rustup default stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-component
      - name: Build crypto component
        run: cargo component build --release
        working-directory: crypto
      - name: Stage crypto.wasm into the package
        run: cp crypto/target/wasm32-wasip1/release/dpyc_crypto.wasm tollbooth_wasmcp/crypto.wasm

      - name: Build sdist and wheel
        run: pip install build && python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # The wheel reaching PyPI is not the whole release — the fleet reads the
      # GitHub Release for what changed. Same extractor the other DPYC repos use.
      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The heading is matched in EITHER style — "## [1.2.3]" or "## 1.2.3 — date".
          # Dots are escaped so 1.2.3 cannot match "1x2x3"; the bracket-expression
          # form ([[] / []]) behaves the same under mawk, gawk and BSD awk.
          VERSION_RE=$(printf '%s' "$VERSION" | sed 's/\./\\./g')
          NOTES=$(awk "/^## [[]?${VERSION_RE}[]]?([ ]|\$)/{found=1; next} /^## [[]?[0-9]/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release $VERSION"
          fi
          echo "$NOTES" > /tmp/release-notes.md

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
